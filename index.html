<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#237a57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="旬味日曆"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>旬味日曆｜台灣當季蔬果</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#173b2d;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}.app{max-width:640px;margin:auto;padding:20px 16px 90px}.hero{background:linear-gradient(135deg,#237a57,#4fa779);color:white;padding:25px;border-radius:26px;box-shadow:0 10px 28px #17644722}.hero h1{margin:0;font-size:29px}.hero p{margin:8px 0 0;opacity:.9}.panel{background:white;border:1px solid #e3ede6;border-radius:22px;padding:19px;margin-top:17px;box-shadow:0 4px 18px #153b2910}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{margin:0;font-size:22px}.sub{color:#64786b;font-size:13px;margin:7px 0 15px}.months{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.months button,.tabs button,.action{cursor:pointer;border:1px solid #dce8df;border-radius:12px;background:#f6faf7;color:#285b43;padding:12px 2px;font-size:14px;font-weight:650}.months button.active,.tabs button.active,.action.primary{background:#237a57;color:white;border-color:#237a57}.tabs{display:flex;gap:8px;margin-top:15px}.tabs button{flex:1}.search{width:100%;border:1px solid #d5e4da;border-radius:13px;padding:14px;font-size:16px;margin-top:14px;background:white}.section{margin-top:18px}.section h3{font-size:17px;margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;border:1px solid #d7eadb;border-radius:12px;padding:9px 11px;background:#f0f8f1;font-size:14px}.chip.fruit{background:#fff7ec;border-color:#f6e2c3}.chip small{margin-left:5px;color:#8a6d42}.chip button{border:0;background:transparent;color:#a7b7a9;font-size:18px;margin-left:5px;cursor:pointer}.chip button.saved{color:#df9b27}.note{background:#f3f7ed;border-radius:14px;padding:13px;font-size:13px;line-height:1.7;color:#526a54}.actions{display:flex;gap:9px;margin-top:18px}.action{flex:1;padding:12px}.empty{color:#8a9c90;font-size:14px}.footer{font-size:12px;color:#73877a;line-height:1.7;margin:22px 5px}button:focus-visible,input:focus-visible{outline:3px solid #91d6b1;outline-offset:2px}</style></head><body><main class="app"><header class="hero"><h1>🌿 旬味日曆</h1><p>台灣當季蔬果・每個月份都吃得新鮮</p></header><section class="panel"><div class="heading"><h2 id="monthTitle"></h2><span id="season"></span></div><p class="sub">點選月份，查看推薦產季食材</p><div id="months" class="months"></div><div class="tabs"><button data-tab="all" class="active">全部</button><button data-tab="veg">🥬 蔬菜</button><button data-tab="fruit">🍎 水果</button><button data-tab="saved">★ 收藏</button></div><input id="search" class="search" placeholder="搜尋蔬果名稱，或反查產季…" aria-label="搜尋蔬果"><div id="results"></div><div class="actions"><button class="action primary" id="copy">複製清單</button><button class="action" id="reset">回到本月</button></div></section><section class="panel"><h3>🛒 採買提醒</h3><div class="note">綠色標籤為蔬菜、橘色標籤為水果。點選 ☆ 收藏常買食材；搜尋時可跨月份查詢。奇異果、藍莓依主要進口產區新季供應月份標示，不等於只有這些月份買得到。</div></section><p class="footer">產季為台灣常見品種與主要產地的概略推薦月份，會隨天候、海拔、品種及供貨變動；實際購買請確認標示產地、新鮮度與價格。本工具不連線收集個人資料，收藏只存在你的裝置。</p></main><script>
const veg={"高麗菜":[11,12,1,2,3],"白蘿蔔":[11,12,1,2,3],"大白菜":[11,12,1,2,3],"胡蘿蔔":[11,12,1,2,3],"菠菜":[11,12,1,2,3],"青花菜":[11,12,1,2,3],"花椰菜":[10,11,12,1,2,3,4],"萵苣（A菜／大陸妹）":[11,12,1,2,3,4],"油菜":[11,12,1,2,3],"青江菜":[10,11,12,1,2,3,4],"小白菜":[10,11,12,1,2,3,4],"茼蒿":[11,12,1,2,3],"芥菜":[11,12,1,2,3],"蘆筍":[3,4,5],"豌豆":[12,1,2,3],"四季豆":[10,11,12,1,2,3,4,5],"空心菜":[4,5,6,7,8,9,10],"地瓜葉":[4,5,6,7,8,9,10],"莧菜":[4,5,6,7,8,9],"絲瓜":[5,6,7,8,9,10],"苦瓜":[5,6,7,8,9,10],"冬瓜":[4,5,6,7,8,9,10],"茄子":[5,6,7,8,9,10],"秋葵":[5,6,7,8,9,10],"小黃瓜":[4,5,6,7,8,9,10],"竹筍":[4,5,6,7,8,9]};
const fruit={"草莓":[12,1,2,3],"橘子":[11,12,1,2],"桶柑":[1,2,3],"茂谷柑":[1,2,3],"柳丁":[11,12,1,2],"棗子":[12,1,2,3],"蓮霧":[12,1,2,3,4,5],"釋迦":[12,1,2],"鳳梨":[3,4,5,6,7],"枇杷":[3,4],"桑葚":[3,4,5],"梅子":[4,5],"芒果":[5,6,7,8],"荔枝":[5,6,7],"西瓜":[5,6,7,8],"香蕉":[5,6,7],"李子":[5,6],"火龍果":[6,7,8,9,10,11],"百香果":[6,7,8,9,10,11],"龍眼":[7,8,9],"梨子":[7,8,9],"文旦柚":[8,9,10],"柿子":[9,10,11,12],"芭樂":[8,9,10,11],"葡萄柚":[10,11],"奇異果（紐西蘭）":[4,5,6,7,8,9],"藍莓（北美）":[6,7,8],"藍莓（南美）":[9,10,11,12,1,2]};
let month=new Date().getMonth()+1,tab='all',query='';let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('seasonal-favs')||'[]'))}catch(e){}const $=id=>document.getElementById(id);const season=m=>m<=2||m===12?'❄️ 冬季':m<=5?'🌱 春季':m<=8?'☀️ 夏季':'🍂 秋季';function items(dict,type){return Object.entries(dict).filter(([name,months])=>(query?name.toLowerCase().includes(query.toLowerCase()):months.includes(month))&&(tab==='all'||tab===type||tab==='saved'&&saved.has(name))).map(([name,months])=>({name,months,type}))}function render(){ $('monthTitle').textContent=query?'🔎 跨月份搜尋':`${month} 月當季推薦`; $('season').textContent=season(month);$('months').innerHTML=Array.from({length:12},(_,i)=>`<button class="${i+1===month?'active':''}" data-month="${i+1}">${i+1}月</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const a=items(veg,'veg'),b=items(fruit,'fruit');let html='';for(const [title,arr,cl] of [['🥬 當季蔬菜',a,'veg'],['🍎 當季水果',b,'fruit']]){if(arr.length){html+=`<div class="section"><h3>${title} (${arr.length})</h3><div class="chips">`+arr.map(item=>`<span class="chip ${cl==='fruit'?'fruit':''}"><span>${item.name}${query?` <small>${item.months.join('、')}月</small>`:''}</span><button data-fav="${item.name}" class="${saved.has(item.name)?'saved':''}" aria-label="收藏${item.name}">${saved.has(item.name)?'★':'☆'}</button></span>`).join('')+'</div></div>'}}$('results').innerHTML=html||'<p class="empty">沒有符合條件的食材。可更換月份或搜尋名稱。</p>';}
document.addEventListener('click',e=>{const m=e.target.closest('[data-month]');if(m){month=Number(m.dataset.month);query='';$('search').value='';render()}const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}const f=e.target.closest('[data-fav]');if(f){saved.has(f.dataset.fav)?saved.delete(f.dataset.fav):saved.add(f.dataset.fav);try{localStorage.setItem('seasonal-favs',JSON.stringify([...saved]))}catch(e){}render()}});$('search').addEventListener('input',e=>{query=e.target.value.trim();render()});$('reset').onclick=()=>{month=new Date().getMonth()+1;tab='all';query='';$('search').value='';render()};$('copy').onclick=async()=>{const a=items(veg,'veg').map(x=>x.name),b=items(fruit,'fruit').map(x=>x.name),txt=`${query?'搜尋：'+query:month+'月當季蔬果'}\n蔬菜：${a.join('、')||'無'}\n水果：${b.join('、')||'無'}`;try{await navigator.clipboard.writeText(txt);$('copy').textContent='✓ 已複製';setTimeout(()=>$('copy').textContent='複製清單',1600)}catch(e){prompt('請複製以下清單',txt)}};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
